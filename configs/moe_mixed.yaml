data:
  image_dirs:
    - data/spacenet3/8bit/Khartoum/images
    - data/spacenet3/8bit/Paris/images
    - data/spacenet3/8bit/Shanghai/images
    - data/spacenet3/8bit/Vegas/images

  mask_dirs:
    - data/spacenet3/8bit/Khartoum/mask
    - data/spacenet3/8bit/Paris/mask
    - data/spacenet3/8bit/Shanghai/mask
    - data/spacenet3/8bit/Vegas/mask

  img_size: 256
  strict_pairing: true
  mask_threshold: 127
  invert_mask: false

model:
  architecture: moe
  in_channels: 3
  out_channels: 1
  base_channels: 8
  num_experts: 2
  expert_names:
    - urban
    - rural
  router_hidden_channels: 16
  top_k: null
  load_balance_weight: 0.04

train:
  epochs: 120
  batch_size: 1
  lr: 0.0005
  weight_decay: 0.0001
  val_split: 0.1
  seed: 42
  num_workers: 0
  num_threads: 4
  dice_weight: 1.5
  bce_weight: 0.7
  metric_threshold: 0.5

predict:
  min_component_area: 20

output:
  run_dir: outputs/moe_mixed_run
  prediction_dir: outputs/moe_mixed_predictions
  graph_dir: outputs/moe_mixed_graphs